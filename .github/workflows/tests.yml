# Ayrıştırıcı testleri — senkron koduna dokunulduğunda çalışır.
# Amaç: belediye sayfa yapısı ya da ayrıştırma mantığı bozulursa, günlük
# senkron sessizce eski veri yayınlamaya başlamadan önce kırmızı yanmak.

name: Parser tests

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

# Sandıklı Portal — günlük otomatik içerik senkronu
# Her gün 05:00 UTC (~08:00 İstanbul) çalışır; değişen dosyaları commit eder.
# GitHub Pages / Netlify / Cloudflare Pages bağlıysa otomatik yeniden yayınlanır.

name: Daily portal sync

on:
  schedule:
    # UTC — yaz saatinde TR 08:00, kışın 08:00 civarı
    - cron: "0 5 * * *"
  workflow_dispatch: # Actions sekmesinden "Run workflow" ile elle çalıştır

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: python scripts/sync_portal.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haberler.html index.html nobetci-eczaneler.html cenaze-ilanlari.html assets/cenaze-data.json || true
          if git diff --staged --quiet; then
            echo "No content changes."
          else
            git commit -m "chore(sync): belediye haber/eczane/vefat otomatik güncelleme"
            git push
          fi

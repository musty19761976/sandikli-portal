# Sandıklı Portal — günlük otomatik içerik senkronu
# Her gün 05:00 UTC (~08:00 İstanbul) çalışır; değişen dosyaları commit eder.
# Ayrıştırma/doğrulama başarısız olursa iş KIRMIZI yanar (sessiz bozulma yok).

name: Daily portal sync

on:
  schedule:
    # UTC — yaz saatinde TR 08:00
    - cron: "0 5 * * *"
  workflow_dispatch: # Actions sekmesinden "Run workflow" ile elle çalıştır

permissions:
  contents: write

# Elle tetikleme ile zamanlanmış çalışma üst üste binmesin
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: python scripts/sync_portal.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nobetci-eczaneler.html cenaze-ilanlari.html assets/cenaze-data.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "chore(sync): eczane + vefat listesi otomatik güncellendi"
          git pull --rebase --autostash
          git push

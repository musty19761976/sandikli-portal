# Sandıklı Portal — otomatik içerik senkronu
# GitHub zamanlanmış işleri birkaç saat geciktirebildiği için gün içinde birden
# çok kez denenir: sabah penceresinde saat başı, öğleden sonra iki kez.
# Değişiklik yoksa commit atılmaz (koşular boşa gitmez).
# Ayrıştırma/doğrulama başarısız olursa iş KIRMIZI yanar (sessiz bozulma yok).

name: Daily portal sync

on:
  schedule:
    # UTC — İstanbul (+3). Sabah penceresi: 05:30 – 12:30 TR, saat başı deneme
    - cron: "30 2-9 * * *"
    # Öğleden sonra: gün içinde eklenen vefat ilanları için
    - cron: "0 13 * * *" # 16:00 TR
    - cron: "0 17 * * *" # 20:00 TR
  workflow_dispatch: # Actions sekmesinden "Run workflow" ile elle çalıştır

permissions:
  contents: write

# Elle tetikleme ile zamanlanmış çalışma üst üste binmesin
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: python scripts/sync_portal.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nobetci-eczaneler.html cenaze-ilanlari.html assets/cenaze-data.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "chore(sync): eczane + vefat listesi otomatik güncellendi"
          git pull --rebase --autostash
          git push
